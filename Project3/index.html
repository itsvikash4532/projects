   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI PROJECTS</title> 
    <head>
    
    <style>
        body {
            background-color: white;
        }

        .header {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px;
            box-sizing: border-box;
        }

        /* Left YouTube Logo */
        .youtube-logo {
            width: 75px;
            height: 52px;
            background-color: #ff0000;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 18px solid white;
            margin-left: 5px;
        }

        /* Center Text */
        .center {
            text-align: center;
            flex: 1;
        }

        .title {
            font-size: 65px;
            font-weight: bold;
            line-height: 1;
        }

        .code {
            color: black;
        }

        .rishta {
            color: #d71920;
        }

        .subtitle {
            font-size: 38px;
            font-weight: bold;
            margin-top: 12px;
        }

        /* Right Side */
        .subscribe {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.3;
        }

        .subscribe-text {
            color: black;
        }

        .channel {
            color: #d71920;
            font-size: 24px;
        }

        .small-youtube {
            width: 42px;
            height: 30px;
            background-color: #ff0000;
            border-radius: 8px;
            margin: 8px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .small-play {
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 11px solid white;
            margin-left: 3px;
        }
    </style>
</head>

<body>

    <div class="header">

        <!-- YouTube Logo -->
        <div class="youtube-logo">
            <div class="play"></div>
        </div>

        <!-- Main Heading -->
        <div class="center">
            <div class="title">
                <span class="code">Code</span><span class="rishta">Rishta</span>
            </div>

            <div class="subtitle">
                YouTube Channel
            </div>
        </div>

        <!-- Subscribe Section -->
        <div class="subscribe">
            <div class="subscribe-text">Subscribe to</div>

            <div class="channel">CodeRishta</div>

            <div class="small-youtube">
                <div class="small-play"></div>
            </div>
        </div>

    </div>
<hr>
<center>
<h2>CodeRishta YouTube Channel Registration / Subscription Form </h2>
</center>
    <form>

        <!-- 1. Personal Information -->
        <fieldset>
            <legend><b>1. Personal Information</b></legend>

            <table>
                <tr>
                    <td><label for="name">Full Name *</label></td>
                    <td>
                        <input type="text" id="name" name="name"
                               size="60" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email Address *</label></td>
                    <td>
                        <input type="email" id="email" name="email"
                               size="60" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="mobile">Mobile Number *</label></td>
                    <td>
                        <input type="tel" id="mobile" name="mobile"
                               size="60" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="dob">Date of Birth</label></td>
                    <td>
                        <input type="date" id="dob" name="dob">
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <!-- 2. I Want to -->
        <fieldset>
            <legend><b>2. I Want to</b></legend>

            <input type="radio" id="subscribe" name="purpose"
                   value="subscribe">
            <label for="subscribe">
                Subscribe to CodeRishta YouTube Channel
            </label>
            <br>

            <input type="radio" id="registration" name="purpose"
                   value="registration">
            <label for="registration">
                General Registration (Stay Updated)
            </label>
        </fieldset>

        <br>

        <!-- 3. Your Interests -->
        <fieldset>
            <legend><b>3. Your Interests (Select any)</b></legend>

            <input type="checkbox" id="web" name="interests"
                   value="Web Development">
            <label for="web">Web Development</label>
            &nbsp;&nbsp;

            <input type="checkbox" id="programming" name="interests"
                   value="Programming">
            <label for="programming">Programming</label>
            &nbsp;&nbsp;

            <input type="checkbox" id="tutorials" name="interests"
                   value="Tutorials">
            <label for="tutorials">Tutorials</label>
            &nbsp;&nbsp;

            <input type="checkbox" id="placements" name="interests"
                   value="Placements">
            <label for="placements">Placements</label>
            &nbsp;&nbsp;

            <input type="checkbox" id="coding" name="interests"
                   value="Coding">
            <label for="coding">Coding</label>

            <br><br>

            <input type="checkbox" id="projects" name="interests"
                   value="Projects">
            <label for="projects">Projects</label>
            &nbsp;&nbsp;

            <input type="checkbox" id="technews" name="interests"
                   value="Tech News">
            <label for="technews">Tech News</label>
            &nbsp;&nbsp;

            <input type="checkbox" id="other" name="interests"
                   value="Other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <!-- 4. Message -->
        <fieldset>
            <legend><b>4. Message (Optional)</b></legend>

            <textarea id="message" name="message"
                      rows="5" cols="85"
                      placeholder="Write your message here..."></textarea>

            <br><br><br>

            <input type="checkbox" id="updates" name="updates"
                   value="yes">

            <label for="updates">
                I agree to receive updates and notifications from
                <span style="color: brown;">CodeRishta</span>
                YouTube Channel.
            </label>

            <br><br><br>

            <center>
                <input type="submit" value="Submit Registration">
                &nbsp;&nbsp;&nbsp;&nbsp;
                <input type="reset" value="Reset Form">
            </center>

            <br>

        </fieldset>

    </form>

    <br><br>

    <hr>

    <!-- Footer -->
    <h3 align="center">
        Thank you for being a part of
        <span style="color: brown;">CodeRishta!</span>
    </h3>
</table>
</body>
</html>
